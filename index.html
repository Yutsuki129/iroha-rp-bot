<head>

    <title>AI角色扮演 - 一色伊呂波</title>

    <!-- 社群預覽卡片設定 (Open Graph) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yutsuki129.github.io/iroha-rp-bot/">

    <meta property="og:description" content="與《果青》的一色伊呂波進行互動對話！好感度系統、小惡魔內心OS、支援多語言。">
    
    <!-- 預覽圖片路徑 -->
    <meta property="og:image" content="https://yutsuki129.github.io/iroha-rp-bot/preview.png">

    <!-- Twitter / X 預覽卡片設定 -->

    <meta name="twitter:title" content="一色伊呂波 AI 角色扮演對話">

    <meta name="twitter:image" content="https://yutsuki129.github.io/iroha-rp-bot/preview.png">

    <link rel="stylesheet" href="style.css">
  </head>
<body>
  <h1>我的青春戀愛喜劇果然有問題</h1>
  <p>你將扮演比企谷八幡，跟一色伊呂波互動，另外我有設告白事件，好感度達到一定值，你的告白就會成功，可以跟伊呂波交往，不過我不會告訴你是多少，呵呵呵~</p>
  對了，好感度高低會影響伊呂波對你的態度，而且我沒有設置回朔，請認真對待每一次互動~
  (備註:頁面刷新會導致記憶流失，有時也有API連接失效的問題，這種時候重新輸入就好，然後語言模型是用免費版本的，所以回復慢是正常的，想要好的體驗麻煩付錢給我~)
  <br>
  <div id="status-bar">
    <strong>玩家：</strong>比企谷八幡 |
    <strong>角色：</strong>一色伊呂波 | 
    <strong>好感度：</strong><span id="affinity-display">50</span>
  </div>

  <div class="lang-selector">
  <label for="language-select">🗣️ 語言 / Language:</label>
  <select id="language-select">
    <option value="繁體中文" selected>繁體中文</option>
    <option value="日本語">日本語</option>
    <option value="English">English</option>
    <option value="한국어">한국어</option>
  </select>
</div>

  <div id="chat-box"></div>

  <div class="input-row">
    <input type="password" id="api-key" placeholder="在此輸入 OpenRouter API Key" style="max-width: 180px;">
    <input type="text" id="user-input" placeholder="說點什麼...">
    <button id="send-btn" onclick="handleSend()">發送</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
